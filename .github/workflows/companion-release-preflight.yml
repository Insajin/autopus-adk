name: Companion release preflight
run-name: Companion release preflight ${{ inputs.release_tag }} ${{ inputs.dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact not-yet-published companion release tag
        required: true
        type: string
      source_commit:
        description: Exact source commit to tag after preflight
        required: true
        type: string
      source_tree:
        description: Exact source tree to tag after preflight
        required: true
        type: string
      static_policy_b64:
        description: Canonical raw-base64url OMP context static policy
        required: true
        type: string
      dispatch_nonce:
        description: Unique caller correlation nonce
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: companion-release-preflight-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  macos-release-preflight:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate exact preflight source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          STATIC_POLICY_B64: ${{ inputs.static_policy_b64 }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'Insajin/autopus-adk' ]]
          [[ "$GITHUB_ACTOR_ID" == '204883817' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_SHA" == "$SOURCE_COMMIT" ]]
          [[ "$RELEASE_TAG" == 'v0.50.96' ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "$SOURCE_COMMIT" ]]
          [[ "$(git rev-parse --verify 'HEAD^{tree}')" == "$SOURCE_TREE" ]]
          [[ "$STATIC_POLICY_B64" =~ ^[A-Za-z0-9_-]+$ && ${#STATIC_POLICY_B64} -le 21846 ]]
          [[ "$DISPATCH_NONCE" =~ ^[0-9a-f]{32}$ ]]
          grep -Fq -- "- 'v0.50.96'" .github/workflows/release.yaml
          grep -Fq -- "omp-context-evidence-v0.50.96" .github/workflows/omp-context-promote.yml

      - name: Verify tidy source without mutation
        shell: bash
        run: go mod tidy -diff

      - name: Build exact production candidate
        id: candidate
        shell: bash
        env:
          COMPANION_RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_SHA: ${{ inputs.source_commit }}
          COMPANION_SOURCE_TREE: ${{ inputs.source_tree }}
          OMP_CONTEXT_STATIC_POLICY_B64: ${{ inputs.static_policy_b64 }}
        run: |
          set -euo pipefail
          [[ "$(/usr/bin/stat -f '%u:%Lp' /Library)" == '0:755' ]]
          staging="$RUNNER_TEMP/auto-release-preflight"
          candidate_root="/Library/autopus-adk-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$candidate_root" =~ ^/Library/autopus-adk-release-preflight-[0-9]+-[0-9]+$ &&
             ! -e "$candidate_root" && ! -L "$candidate_root" ]]
          scripts/companion-release/build-omp-context-candidate.sh "$staging"
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 -o root -g wheel "$candidate_root"
          candidate="$candidate_root/auto"
          /usr/bin/sudo -n /usr/bin/install -m 0555 -o root -g wheel "$staging" "$candidate"
          rm -f -- "$staging"
          [[ "$("$candidate" version --short)" == '0.50.96' ]]
          [[ "$(/usr/bin/stat -f '%u:%Lp' "$candidate_root")" == '0:755' &&
             "$(/usr/bin/stat -f '%u:%Lp' "$candidate")" == '0:555' ]]
          printf 'path=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Verify Darwin release execution support
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Darwin' && "$(uname -m)" == 'arm64' ]]
          /usr/bin/arch -arm64 /usr/bin/true
          /usr/bin/arch -x86_64 /usr/bin/true
          /usr/bin/sudo -n -u nobody /usr/bin/true

      - name: Materialize exact arm64 OMP release canary
        shell: bash
        run: scripts/companion-release/materialize-omp-release-canary.sh

      - name: Execute exact candidate with isolated OMP canary
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          OMP_CONTEXT_RELEASE_CANARY_ROOT: /private/tmp/autopus-adk-omp-canary-${{ github.run_id }}-${{ github.run_attempt }}
          OMP_CONTEXT_RELEASE_CANARY_EXECUTABLE: /private/tmp/autopus-adk-omp-canary-${{ github.run_id }}-${{ github.run_attempt }}/omp-darwin-arm64
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/auto-companion-exec-smoke"
          go build -trimpath -o "$gate" ./scripts/companion-release/execsmoke
          "$gate" --artifact "$CANDIDATE" --expected-version 0.50.96 \
            --architecture arm64 --timeout 30s

      - name: Remove preflight candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/auto-release-preflight"
          candidate_root="/Library/autopus-adk-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$candidate_root" =~ ^/Library/autopus-adk-release-preflight-[0-9]+-[0-9]+$ ]]
          if [[ ! -e "$candidate_root" && ! -L "$candidate_root" ]]; then exit 0; fi
          [[ ! -L "$candidate_root" &&
             "$(/usr/bin/stat -f '%u:%Lp' /Library)" == '0:755' &&
             "$(/usr/bin/stat -f '%u:%Lp' "$candidate_root")" == '0:755' ]]
          candidate="$candidate_root/auto"
          [[ ! -L "$candidate" ]]
          if [[ -e "$candidate" ]]; then
            [[ "$(/usr/bin/stat -f '%u:%Lp' "$candidate")" == '0:555' ]]
          fi
          /usr/bin/sudo -n /bin/rm -rf -- "$candidate_root"
          [[ ! -e "$candidate_root" && ! -L "$candidate_root" ]]

      - name: Remove isolated OMP release canary
        if: always()
        shell: bash
        run: scripts/companion-release/remove-omp-release-canary.sh
