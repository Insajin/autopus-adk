          ADK_KEY_ROTATION_VERIFIER: ${{ runner.temp }}/key-rotation-authority/verify-rotation.sh
        run: |
          set -euo pipefail
          checksums_path="$RUNNER_TEMP/autopus-$GITHUB_REF_NAME-checksums.txt"
          [[ "$OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
