name: Release
on:
  push:
    # This is the only armed release-tag trigger. The fixed A22 rotation
    # distribution ref appears below only as pre-tag authorization, never as
    # another release trigger. Wildcard release tags are forbidden.
    tags:
      - 'v0.50.109'
permissions:
  contents: read
jobs:
  # Release gate: run the full CI suite (build/test/lint/e2e) on the tagged commit.
  # If any CI job fails, the release job below is skipped — a red build cannot ship.
  ci:
    uses: ./.github/workflows/ci.yaml
  # Security gate: run secret scan and govulncheck on the tagged commit.
  # Blocks release if any vulnerability or secret leak is detected.
  security:
    uses: ./.github/workflows/security.yml

  omp-canonical-bridge-candidate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate-artifact-sha256: ${{ steps.candidate.outputs.candidate-artifact-sha256 }}
      rotation-ref-commit: ${{ steps.rotation.outputs.rotation-ref-commit }}
      rotation-document-sha256: ${{ steps.rotation.outputs.rotation-document-sha256 }}
      authority-commit: ${{ steps.authority.outputs.authority-commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Materialize immutable key-rotation authority
        id: authority
        shell: bash
        env:
          EXPECTED_AUTHORITY_COMMIT: ${{ vars.ADK_KEY_ROTATION_AUTHORITY_COMMIT }}
        run: |
          set -euo pipefail
          authority="$RUNNER_TEMP/key-rotation-authority"
          receipt="$RUNNER_TEMP/key-rotation-authority-receipt.json"
          scripts/companion-release/materialize-key-rotation-authority.sh \
            --public "$EXPECTED_AUTHORITY_COMMIT" "$authority" > "$receipt"
          authority_commit=$(jq -er --arg expected "$EXPECTED_AUTHORITY_COMMIT" '
            select(.assertion_mode == "public" and .authority_commit == $expected) |
            .authority_commit
          ' "$receipt")
          printf 'authority-commit=%s\n' "$authority_commit" >> "$GITHUB_OUTPUT"

      - name: Verify independently signed exact key rotation
        id: rotation
        shell: bash
        env:
          AUTOPUS_ADK_CHANNEL_KEY_ID: ${{ vars.AUTOPUS_ADK_CHANNEL_KEY_ID }}
          AUTOPUS_ADK_CHANNEL_PUBLIC_KEY: ${{ vars.AUTOPUS_ADK_CHANNEL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          source_tree=$(git rev-parse --verify 'HEAD^{tree}')
          receipt=$(env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            AUTOPUS_ADK_CHANNEL_KEY_ID="$AUTOPUS_ADK_CHANNEL_KEY_ID" \
            AUTOPUS_ADK_CHANNEL_PUBLIC_KEY="$AUTOPUS_ADK_CHANNEL_PUBLIC_KEY" \
            scripts/companion-release/verify-key-rotation-sidecar.sh --public-ruleset \
            "$RUNNER_TEMP/key-rotation-authority/verify-rotation.sh" "$GITHUB_SHA" "$source_tree" \
            "$RUNNER_TEMP/verified-key-rotation")
          rotation_ref_commit=$(jq -er '.rotation_ref_commit' <<<"$receipt")
          rotation_document_sha256=$(jq -er '.rotation_document_sha256' <<<"$receipt")
          [[ "$(jq -er '.assertion_mode' <<<"$receipt")" == 'public' ]]
          [[ "$rotation_ref_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$rotation_document_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'rotation-ref-commit=%s\n' "$rotation_ref_commit" >>"$GITHUB_OUTPUT"
          printf 'rotation-document-sha256=%s\n' "$rotation_document_sha256" >>"$GITHUB_OUTPUT"

      - name: Validate exact R2-signed A22 source
        id: release-source
        shell: bash
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" COMPANION_SOURCE_PIN_REQUIRED=0 \
            COMPANION_RELEASE_TAG_SIGNATURE_REQUIRED=1 \
            ADK_KEY_ROTATION_VERIFIED=1 \
            scripts/companion-release/validate-source.sh

      - name: Build canonical-full bridge candidate
        id: candidate
        shell: bash
        env:
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/auto-darwin-arm64-canonical-full-bridge"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            COMPANION_RELEASE_TAG="$GITHUB_REF_NAME" GITHUB_SHA="$GITHUB_SHA" \
            COMPANION_SOURCE_TREE="$COMPANION_SOURCE_TREE" \
            scripts/companion-release/build-omp-context-candidate.sh "$candidate"
          candidate_sha=$(shasum -a 256 "$candidate" | awk '{print $1}')
          [[ "$candidate_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'candidate-artifact-sha256=%s\n' "$candidate_sha" >>"$GITHUB_OUTPUT"

  release:
    needs: [ci, security, omp-canonical-bridge-candidate]
    # Only the exact tag trigger can enter the protected release environment.
    # The rotation sidecar and validate-source.sh then bind the authorized
    # source, R2 signature, and protected source variables.
    if: github.ref_type == 'tag'
    environment:
      name: adk-companion-release
    permissions:
      contents: write
      id-token: write
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Materialize matching protected key-rotation authority
        id: authority
        shell: bash
        env:
          CANDIDATE_AUTHORITY_COMMIT: ${{ needs.omp-canonical-bridge-candidate.outputs.authority-commit }}
          PROTECTED_AUTHORITY_COMMIT: ${{ vars.ADK_PROTECTED_KEY_ROTATION_AUTHORITY_COMMIT }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_AUTHORITY_COMMIT" =~ ^[0-9a-f]{40}$ &&
             "${PROTECTED_AUTHORITY_COMMIT:-}" =~ ^[0-9a-f]{40}$ &&
             "$PROTECTED_AUTHORITY_COMMIT" == "$CANDIDATE_AUTHORITY_COMMIT" ]]
          authority="$RUNNER_TEMP/key-rotation-authority"
          receipt="$RUNNER_TEMP/key-rotation-authority-receipt.json"
          scripts/companion-release/materialize-key-rotation-authority.sh \
            --public "$PROTECTED_AUTHORITY_COMMIT" "$authority" > "$receipt"
          authority_commit=$(jq -er --arg expected "$CANDIDATE_AUTHORITY_COMMIT" '
            select(.assertion_mode == "public" and .authority_commit == $expected) |
            .authority_commit
          ' "$receipt")
          printf 'authority-commit=%s\n' "$authority_commit" >> "$GITHUB_OUTPUT"

      - name: Reverify independently signed exact key rotation
        shell: bash
        env:
          AUTOPUS_ADK_CHANNEL_KEY_ID: ${{ vars.AUTOPUS_ADK_CHANNEL_KEY_ID }}
          AUTOPUS_ADK_CHANNEL_PUBLIC_KEY: ${{ vars.AUTOPUS_ADK_CHANNEL_PUBLIC_KEY }}
          EXPECTED_ROTATION_REF_COMMIT: ${{ needs.omp-canonical-bridge-candidate.outputs.rotation-ref-commit }}
          EXPECTED_ROTATION_DOCUMENT_SHA256: ${{ needs.omp-canonical-bridge-candidate.outputs.rotation-document-sha256 }}
        run: |
          set -euo pipefail
          source_tree=$(git rev-parse --verify 'HEAD^{tree}')
          receipt=$(env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            AUTOPUS_ADK_CHANNEL_KEY_ID="$AUTOPUS_ADK_CHANNEL_KEY_ID" \
            AUTOPUS_ADK_CHANNEL_PUBLIC_KEY="$AUTOPUS_ADK_CHANNEL_PUBLIC_KEY" \
            scripts/companion-release/verify-key-rotation-sidecar.sh --public-ruleset \
            "$RUNNER_TEMP/key-rotation-authority/verify-rotation.sh" "$GITHUB_SHA" "$source_tree" \
            "$RUNNER_TEMP/verified-key-rotation")
          [[ "$(jq -er '.rotation_ref_commit' <<<"$receipt")" == "$EXPECTED_ROTATION_REF_COMMIT" ]]
          [[ "$(jq -er '.rotation_document_sha256' <<<"$receipt")" == "$EXPECTED_ROTATION_DOCUMENT_SHA256" ]]
          [[ "$(jq -er '.assertion_mode' <<<"$receipt")" == 'public' ]]

      - name: Validate exact release source
        id: release-source
        shell: bash
        env:
          COMPANION_APPROVED_SOURCE_COMMIT: ${{ vars.ADK_COMPANION_APPROVED_SOURCE_COMMIT }}
          COMPANION_APPROVED_SOURCE_TREE: ${{ vars.ADK_COMPANION_APPROVED_SOURCE_TREE }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" COMPANION_SOURCE_PIN_REQUIRED=1 \
            COMPANION_RELEASE_TAG_SIGNATURE_REQUIRED=1 ADK_KEY_ROTATION_VERIFIED=1 \
            COMPANION_APPROVED_SOURCE_COMMIT="$COMPANION_APPROVED_SOURCE_COMMIT" \
            COMPANION_APPROVED_SOURCE_TREE="$COMPANION_APPROVED_SOURCE_TREE" \
            scripts/companion-release/validate-source.sh

      - name: Verify operator-owned canonical-full bridge reservation
        id: release-reservation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          CANDIDATE_ARTIFACT_SHA256: ${{ needs.omp-canonical-bridge-candidate.outputs.candidate-artifact-sha256 }}
          ROTATION_REF_COMMIT: ${{ needs.omp-canonical-bridge-candidate.outputs.rotation-ref-commit }}
          ROTATION_DOCUMENT_SHA256: ${{ needs.omp-canonical-bridge-candidate.outputs.rotation-document-sha256 }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          expected_assets=$(printf '%s\n' \
            "autopus-adk_${release_version}_darwin_amd64.tar.gz" \
            "autopus-adk_${release_version}_darwin_arm64.tar.gz" \
            "autopus-adk_${release_version}_linux_amd64.tar.gz" \
            "autopus-adk_${release_version}_linux_arm64.tar.gz" \
            "autopus-adk_${release_version}_windows_amd64.tar.gz" \
            "autopus-adk_${release_version}_windows_amd64.zip" \
            "autopus-adk_${release_version}_windows_arm64.tar.gz" \
            "autopus-adk_${release_version}_windows_arm64.zip" \
            'checksums.txt' 'checksums.txt.bundle' 'checksums.txt.signatures' \
            'omp-context-bridge-release.v1.json' \
            'adk-key-rotation-v1.json' 'adk-key-rotation-v1.sig' \
            'release-lineage-v1.json' 'release-lineage-v1.sig' |
            jq -Rsc 'split("\n") | map(select(length > 0))')
          releases=$(gh api --paginate --slurp \
            'repos/Insajin/autopus-adk/releases?per_page=100')
          reservation=$(jq -ce --arg tag "$GITHUB_REF_NAME" \
            '[.[][]] as $all |
             [$all[] | select(.tag_name == $tag)] as $tagged |
             [$all[] | select(.draft == true and .name == $tag)] as $named |
             if ($tagged | length) == 1 and ($named | length) == 1 and
                $tagged[0].id == $named[0].id
             then $tagged[0]
             else error("bridge reservation is missing, duplicated, or name-colliding")
             end' <<<"$releases")
          jq -e --arg tag "$GITHUB_REF_NAME" --arg source "$GITHUB_SHA" \
            --argjson expected "$expected_assets" \
            '.draft == true and .prerelease == false and .author.id == 204883817 and
             .target_commitish == $source and .name == $tag and
             (.assets | type == "array") and
             ([.assets[].name] | unique | length) == (.assets | length) and
             all(.assets[];
               (.id | type == "number" and .id > 0) and
               (.name as $name | $expected | index($name) != null))' \
            <<<"$reservation" >/dev/null
          reservation_body=$(jq -er '.body' <<<"$reservation")
          while IFS= read -r asset_id; do
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            gh api --method DELETE \
              "repos/Insajin/autopus-adk/releases/assets/${asset_id}"
          done < <(jq -r '.assets[].id' <<<"$reservation")
          release_id=$(jq -r '.id' <<<"$reservation")
          reservation=$(gh api "repos/Insajin/autopus-adk/releases/${release_id}")
          jq -e --argjson release_id "$release_id" --arg source "$GITHUB_SHA" \
            --arg body "$reservation_body" \
            '.id == $release_id and .draft == true and .prerelease == false and
             .author.id == 204883817 and .target_commitish == $source and
             .body == $body and (.assets | type == "array" and length == 0)' \
            <<<"$reservation" >/dev/null
          release_id=$(jq -r '.id' <<<"$reservation")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          printf 'release-id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"


      - name: Verify Darwin release execution support
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Darwin' ]]
          [[ "$(uname -m)" == 'arm64' ]]
          /usr/bin/arch -arm64 /usr/bin/true
          /usr/bin/arch -x86_64 /usr/bin/true
          /usr/bin/sudo -n -u nobody /usr/bin/true

      - name: Materialize exact arm64 OMP release canary
        shell: bash
        run: scripts/companion-release/materialize-omp-release-canary.sh

      - name: Verify tidy source without mutation
        shell: bash
        run: go mod tidy -diff

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "v2.17.0"
          install-only: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Build companion release verification tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signer="$RUNNER_TEMP/auto-companion-manifest-signer"
          verifier="$RUNNER_TEMP/auto-companion-receipt-verifier"
          manifest_verifier="$RUNNER_TEMP/auto-companion-manifest-verifier"
          exec_smoke_gate="$RUNNER_TEMP/auto-companion-exec-smoke-gate"
          omp_lineage_verifier="$RUNNER_TEMP/auto-omp-context-lineage-verifier"
          [[ ! -e "$signer" && ! -L "$signer" &&
             ! -e "$verifier" && ! -L "$verifier" &&
             ! -e "$manifest_verifier" && ! -L "$manifest_verifier" &&
             ! -e "$exec_smoke_gate" && ! -L "$exec_smoke_gate" &&
             ! -e "$omp_lineage_verifier" && ! -L "$omp_lineage_verifier" ]]
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$signer" ./cmd/auto
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$verifier" \
            ./internal/companionmanifest/receiptverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$manifest_verifier" \
            ./scripts/companion-release/manifestverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$exec_smoke_gate" \
            ./scripts/companion-release/execsmoke
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$omp_lineage_verifier" \
            ./scripts/companion-release/ompcontextlineageverify
          chmod 0700 "$signer" "$verifier" "$manifest_verifier" \
            "$exec_smoke_gate" "$omp_lineage_verifier"

      - name: Stage canonical-full bridge manifest for release
        shell: bash
        env:
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          CANDIDATE_ARTIFACT_SHA256: ${{ needs.omp-canonical-bridge-candidate.outputs.candidate-artifact-sha256 }}
          ROTATION_REF_COMMIT: ${{ needs.omp-canonical-bridge-candidate.outputs.rotation-ref-commit }}
          ROTATION_DOCUMENT_SHA256: ${{ needs.omp-canonical-bridge-candidate.outputs.rotation-document-sha256 }}
        run: |
          set -euo pipefail
          umask 077
          staged='.autopus/runtime/release-evidence'
          rm -rf -- "$staged"
          install -d -m 0700 "$staged"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            COMPANION_RELEASE_TAG="$GITHUB_REF_NAME" \
            COMPANION_SOURCE_COMMIT="$GITHUB_SHA" \
            COMPANION_SOURCE_TREE="$COMPANION_SOURCE_TREE" \
            OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256="$CANDIDATE_ARTIFACT_SHA256" \
            ADK_KEY_ROTATION_REF_COMMIT="$ROTATION_REF_COMMIT" \
            ADK_KEY_ROTATION_DOCUMENT_SHA256="$ROTATION_DOCUMENT_SHA256" \
            scripts/companion-release/produce-omp-context-bridge-manifest.sh \
            "$staged/omp-context-bridge-release.v1.json"
          install -m 0600 \
            "$RUNNER_TEMP/verified-key-rotation/adk-key-rotation-v1.json" \
            "$staged/adk-key-rotation-v1.json"
          install -m 0600 \
            "$RUNNER_TEMP/verified-key-rotation/adk-key-rotation-v1.sig" \
            "$staged/adk-key-rotation-v1.sig"
          [[ -z "$(git status --porcelain)" ]] ||
            { echo '::error::staging the bridge manifest dirtied the release worktree'; exit 1; }
      - name: Prepare release credentials
        id: release-credentials
        shell: bash
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ADK_COMPANION_ED25519_PRIVATE_KEY: ${{ secrets.ADK_COMPANION_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in \
            APPLE_API_ISSUER_SECRET APPLE_API_KEY_SECRET APPLE_API_KEY_P8 \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            ADK_COMPANION_ED25519_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::required release credential ${name} is not configured"
              exit 1
            fi
          done
          if [[ ! "$APPLE_API_KEY_SECRET" =~ ^[A-Za-z0-9]{1,64}$ ]] || \
             [[ ! "$APPLE_API_ISSUER_SECRET" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo '::error::Apple API key metadata is invalid'
            exit 1
          fi
          credential_dir="$RUNNER_TEMP/adk-release-credentials"
          [[ ! -e "$credential_dir" && ! -L "$credential_dir" ]]
          install -m 0700 -d "$credential_dir"
          api_key_path="$credential_dir/AuthKey_${APPLE_API_KEY_SECRET}.p8"
          certificate_path="$credential_dir/developer-id.p12"
          companion_key_path="$credential_dir/companion-ed25519-private-key"
          keychain_path="$RUNNER_TEMP/adk-release.keychain-db"
          keychain_password_file="$credential_dir/keychain-password"
          [[ ! -e "$keychain_path" && ! -L "$keychain_path" ]]
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$ADK_COMPANION_ED25519_PRIVATE_KEY" > "$companion_key_path"
          /usr/bin/openssl rand -hex 32 > "$keychain_password_file"
          chmod 0600 \
            "$api_key_path" "$certificate_path" "$companion_key_path" \
            "$keychain_password_file"
          keychain_password=$(<"$keychain_password_file")
          security create-keychain -p "$keychain_password" "$keychain_path" >/dev/null
          chmod 0600 "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F'"' '/Developer ID Application:/ && /\(GP2PFA2PUV\)/ { print $2 }')
          if [[ -z "$identity" || "$identity" == *$'\n'* ]]; then
            echo '::error::exactly one GP2PFA2PUV Developer ID Application identity is required'
            exit 1
          fi
          rm -f -- "$certificate_path"
          printf 'apple-signing-identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Materialize release signing key
        shell: bash
        env:
          ADK_RELEASE_ECDSA_PRIVATE_KEY: ${{ secrets.ADK_RELEASE_ECDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$ADK_RELEASE_ECDSA_PRIVATE_KEY" ]]
          credential_dir="$RUNNER_TEMP/adk-release-credentials"
          [[ -d "$credential_dir" && ! -L "$credential_dir" ]]
          release_signing_key_path="$credential_dir/release-ecdsa-private-key"
          [[ ! -e "$release_signing_key_path" && ! -L "$release_signing_key_path" ]]
          printf '%s' "$ADK_RELEASE_ECDSA_PRIVATE_KEY" > "$release_signing_key_path"
          chmod 0600 "$release_signing_key_path"

      - name: Verify release signing key pair
        shell: bash
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            scripts/release-signing/verify-key-pair.sh \
            "$RUNNER_TEMP/adk-release-credentials/release-ecdsa-private-key" \
            scripts/release-signing/release-k1-public.pem \
            scripts/release-signing/release-k1.fingerprint

      - name: Verify release nobody privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(/usr/bin/id -u)
          nobody_uid=$(/usr/bin/id -u nobody)
          [[ "$runner_uid" =~ ^[0-9]+$ && "$nobody_uid" =~ ^[0-9]+$ ]]
          [[ "$runner_uid" != "$nobody_uid" ]]
          isolated_uid=$(/usr/bin/sudo -n -u nobody /usr/bin/env -i \
            PATH=/usr/bin:/bin /usr/bin/id -u)
          [[ "$isolated_uid" == "$nobody_uid" ]]
          credential_dir="$RUNNER_TEMP/adk-release-credentials"
          sentinel="$credential_dir/nobody-boundary-sentinel"
          keychain="$RUNNER_TEMP/adk-release.keychain-db"
          helper="$RUNNER_TEMP/auto-companion-exec-smoke-gate"
          [[ -d "$credential_dir" && ! -L "$credential_dir" ]]
          [[ "$(/usr/bin/stat -f '%u:%Lp' "$credential_dir")" == "$runner_uid:700" ]]
          [[ ! -e "$sentinel" && ! -L "$sentinel" ]]
          /usr/bin/printf 'release privilege boundary probe\n' > "$sentinel"
          /bin/chmod 0600 "$sentinel"
          api_key_paths=("$credential_dir"/AuthKey_*.p8)
          [[ "${#api_key_paths[@]}" -eq 1 && -f "${api_key_paths[0]}" && ! -L "${api_key_paths[0]}" ]]
          protected_paths=("$sentinel" "${api_key_paths[0]}" \
            "$credential_dir/companion-ed25519-private-key" \
            "$credential_dir/release-ecdsa-private-key" \
            "$credential_dir/keychain-password" "$keychain" "$helper")
          protected_modes=(600 600 600 600 600 600 700)
          for index in "${!protected_paths[@]}"; do
            protected_path="${protected_paths[$index]}"
            expected_mode="${protected_modes[$index]}"
            [[ -f "$protected_path" && ! -L "$protected_path" ]]
            [[ "$(/usr/bin/stat -f '%u:%Lp' "$protected_path")" == "$runner_uid:$expected_mode" ]]
            for permission in -r -w -x; do
              if /usr/bin/sudo -n -u nobody /usr/bin/env -i PATH=/usr/bin:/bin \
                /bin/test "$permission" "$protected_path"; then
                echo "::error::nobody unexpectedly has $permission access to protected release state"
                exit 1
              fi
            done
          done
          if /usr/bin/sudo -n -u nobody /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/sudo -n -u root /usr/bin/true >/dev/null 2>&1; then
            echo '::error::nobody unexpectedly regained root through sudo'
            exit 1
          fi

