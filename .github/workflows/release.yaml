      - name: Verify reserved release was published
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-reservation.outputs.release-id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          # 자산 이름은 트리거 태그에서 파생한다 — GoReleaser의 name_template과 동일한 좌표다.
          release_version="${GITHUB_REF_NAME#v}"
          [[ -n "$release_version" && "$release_version" != "$GITHUB_REF_NAME" ]]
          expected_assets=$(printf '%s\n' \
            "autopus-adk_${release_version}_darwin_amd64.tar.gz" \
            "autopus-adk_${release_version}_darwin_arm64.tar.gz" \
            "autopus-adk_${release_version}_linux_amd64.tar.gz" \
            "autopus-adk_${release_version}_linux_arm64.tar.gz" \
            "autopus-adk_${release_version}_windows_amd64.tar.gz" \
            "autopus-adk_${release_version}_windows_amd64.zip" \
            "autopus-adk_${release_version}_windows_arm64.tar.gz" \
            "autopus-adk_${release_version}_windows_arm64.zip" \
            'checksums.txt' 'checksums.txt.bundle' 'checksums.txt.signatures' \
            'omp-context-bridge-release.v1.json' \
            'adk-key-rotation-v1.json' 'adk-key-rotation-v1.sig' \
            'release-lineage-v1.json' 'release-lineage-v1.sig' |
            jq -Rsc 'split("\n") | map(select(length > 0))')
          release=$(gh api "repos/Insajin/autopus-adk/releases/${RELEASE_ID}")
          jq -e --argjson release_id "$RELEASE_ID" --arg commit "$GITHUB_SHA" \
            --arg tag "$GITHUB_REF_NAME" --argjson expected "$expected_assets" \
            '.id == $release_id and .tag_name == $tag and
             .target_commitish == $commit and .author.id == 204883817 and
             .draft == false and .prerelease == false and .immutable == true and
             (.assets | type == "array" and length == ($expected | length)) and
             ([.assets[].name] | sort) == ($expected | sort) and
             ([.assets[].name] | unique | length) == ($expected | length) and
             all(.assets[];
               .state == "uploaded" and (.size | type == "number" and . > 0) and
               (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))' \
            <<<"$release" >/dev/null

      - name: Remove isolated OMP release canary
