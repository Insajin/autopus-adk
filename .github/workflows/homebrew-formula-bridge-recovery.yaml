name: Recover Homebrew Formula Bridge

on:
  workflow_dispatch: {}

# Run only after the immutable bridge release exists and only to retry a
# transient Homebrew tap write. The release tag's own source is the authority.
permissions:
  contents: read

jobs:
  recover-formula-bridge:
    if: github.ref == 'refs/tags/v0.50.109'
    environment:
      name: adk-companion-release
    permissions:
      contents: read
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out exact dispatched bridge tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Materialize immutable rotation authority and build bridge verifiers
        id: authority
        shell: bash
        env:
          REPOSITORY_AUTHORITY_COMMIT: ${{ vars.ADK_KEY_ROTATION_AUTHORITY_COMMIT }}
          PROTECTED_AUTHORITY_COMMIT: ${{ vars.ADK_PROTECTED_KEY_ROTATION_AUTHORITY_COMMIT }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${REPOSITORY_AUTHORITY_COMMIT:-}" =~ ^[0-9a-f]{40}$ &&
             "${PROTECTED_AUTHORITY_COMMIT:-}" =~ ^[0-9a-f]{40}$ &&
             "$PROTECTED_AUTHORITY_COMMIT" == "$REPOSITORY_AUTHORITY_COMMIT" ]]
          authority="$RUNNER_TEMP/key-rotation-authority"
          receipt="$RUNNER_TEMP/key-rotation-authority-receipt.json"
          lineage_verifier="$RUNNER_TEMP/auto-omp-context-lineage-verifier"
          manifest_verifier="$RUNNER_TEMP/auto-companion-manifest-verifier"
          [[ ! -e "$authority" && ! -L "$authority" &&
             ! -e "$lineage_verifier" && ! -L "$lineage_verifier" &&
             ! -e "$manifest_verifier" && ! -L "$manifest_verifier" ]]
          scripts/companion-release/materialize-key-rotation-authority.sh \
            --public "$PROTECTED_AUTHORITY_COMMIT" "$authority" > "$receipt"
          authority_commit=$(jq -er --arg expected "$PROTECTED_AUTHORITY_COMMIT" '
            select(.assertion_mode == "public" and .authority_commit == $expected) |
            .authority_commit
          ' "$receipt")
          printf 'authority-commit=%s\n' "$authority_commit" >> "$GITHUB_OUTPUT"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$lineage_verifier" \
            ./scripts/companion-release/ompcontextlineageverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$manifest_verifier" \
            ./scripts/companion-release/manifestverify
          chmod 0700 "$lineage_verifier" "$manifest_verifier"


      - name: Validate exact R2-signed recovery source
        id: release-source
        shell: bash
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse --verify 'HEAD^{commit}')
          validation_output=$(mktemp "$RUNNER_TEMP/formula-recovery-source.XXXXXX")
          trap 'rm -f -- "$validation_output"' EXIT
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" GITHUB_REF_TYPE='tag' \
            GITHUB_SHA="$actual_head" GITHUB_OUTPUT="$validation_output" \
            COMPANION_SOURCE_PIN_REQUIRED=0 COMPANION_RELEASE_TAG_SIGNATURE_REQUIRED=1 \
            ADK_KEY_ROTATION_VERIFIED=1 \
            scripts/companion-release/validate-source.sh
          source_commit=$(sed -n 's/^source-commit=//p' "$validation_output")
          source_tree=$(sed -n 's/^source-tree=//p' "$validation_output")
          [[ "$source_commit" == "$actual_head" && "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'source-commit=%s\n' "$source_commit" >>"$GITHUB_OUTPUT"
          printf 'source-tree=%s\n' "$source_tree" >>"$GITHUB_OUTPUT"

      - name: Rebuild independent canonical-full bridge candidate
        id: candidate
        shell: bash
        env:
          COMPANION_SOURCE_COMMIT: ${{ steps.release-source.outputs.source-commit }}
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/auto-darwin-arm64-canonical-full-bridge"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            COMPANION_RELEASE_TAG="$GITHUB_REF_NAME" GITHUB_SHA="$COMPANION_SOURCE_COMMIT" \
            COMPANION_SOURCE_TREE="$COMPANION_SOURCE_TREE" \
            scripts/companion-release/build-omp-context-candidate.sh "$candidate"
          candidate_sha=$(shasum -a 256 "$candidate" | awk '{print $1}')
          [[ "$candidate_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'candidate-artifact-sha256=%s\n' "$candidate_sha" >>"$GITHUB_OUTPUT"

      - name: Verify current immutable canonical-full bridge release
        id: release-evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANION_SOURCE_COMMIT: ${{ steps.release-source.outputs.source-commit }}
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate.outputs.candidate-artifact-sha256 }}
          ADK_KEY_ROTATION_VERIFIER: ${{ runner.temp }}/key-rotation-authority/verify-rotation.sh
        run: |
          set -euo pipefail
          checksums_path="$RUNNER_TEMP/autopus-$GITHUB_REF_NAME-checksums.txt"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            COMPANION_SOURCE_COMMIT="$COMPANION_SOURCE_COMMIT" \
            COMPANION_SOURCE_TREE="$COMPANION_SOURCE_TREE" \
            OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256="$OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256" \
            ADK_KEY_ROTATION_VERIFIER="$ADK_KEY_ROTATION_VERIFIER" \
            OMP_CONTEXT_LINEAGE_VERIFIER="$RUNNER_TEMP/auto-omp-context-lineage-verifier" \
            COMPANION_MANIFEST_VERIFIER="$RUNNER_TEMP/auto-companion-manifest-verifier" \
            scripts/companion-release/verify-current-release.sh "$checksums_path"
          printf 'checksums-path=%s\n' "$checksums_path" >>"$GITHUB_OUTPUT"

      - name: Create Homebrew tap token
        id: homebrew-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: Insajin
          repositories: homebrew-autopus
          permission-contents: write

      - name: Reconcile Homebrew Cask
        shell: bash
        env:
          COMPANION_CHECKSUMS_PATH: ${{ steps.release-evidence.outputs.checksums-path }}
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-app-token.outputs.token }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            COMPANION_VERSION="${GITHUB_REF_NAME#v}" \
            COMPANION_HOMEBREW_POLICY='cask-only' \
            COMPANION_CHECKSUMS_PATH="$COMPANION_CHECKSUMS_PATH" \
            HOMEBREW_TAP_TOKEN="$HOMEBREW_TAP_TOKEN" \
            scripts/companion-release/publish-homebrew-formula-bridge.sh

      - name: Remove downloaded release evidence
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/autopus-$GITHUB_REF_NAME-checksums.txt"
